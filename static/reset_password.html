<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - Homefind</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { display:flex; justify-content:center; align-items:center; min-height:100vh; background:#f4f6f8; }
    .card { background:#fff; padding:2rem; border-radius:12px; box-shadow:0 2px 16px rgba(0,0,0,.10); width:100%; max-width:420px; }
    h2 { margin-bottom:1.2rem; color:#1a1a2e; }
    .field { margin-bottom:1rem; }
    label { display:block; font-size:.9rem; font-weight:600; margin-bottom:.3rem; }
    input { width:100%; padding:.6rem .8rem; border:1px solid #ccc; border-radius:6px; font-size:1rem; box-sizing:border-box; }
    button { width:100%; padding:.75rem; background:#4f46e5; color:#fff; border:none; border-radius:6px; font-size:1rem; font-weight:600; cursor:pointer; }
    button:hover { background:#4338ca; }
    #msg { margin-top:1rem; padding:.7rem 1rem; border-radius:6px; display:none; font-size:.95rem; }
    #msg.error { background:#fee2e2; color:#b91c1c; }
    #msg.success { background:#d1fae5; color:#065f46; }
    .back { display:block; text-align:center; margin-top:1rem; font-size:.9rem; color:#4f46e5; text-decoration:none; }
  </style>
</head>
<body>
<div class="card">
  <h2>Reset your password</h2>
  <div class="field">
    <label for="pw">New password</label>
    <input type="password" id="pw" placeholder="Enter new password" autocomplete="new-password" />
  </div>
  <div class="field">
    <label for="pw2">Confirm password</label>
    <input type="password" id="pw2" placeholder="Confirm new password" autocomplete="new-password" />
  </div>
  <button id="btn" onclick="doReset()">Set new password</button>
  <div id="msg"></div>
  <a class="back" href="login.html">Back to sign in</a>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const token = params.get('token') || '';
  if (!token) {
    document.querySelector('.card').innerHTML = '<p style="color:#b91c1c;text-align:center">Invalid or missing reset token. <a href="login.html">Back to sign in</a></p>';
  }
  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text; el.className = type; el.style.display = 'block';
  }
  async function doReset() {
    const pw = document.getElementById('pw').value;
    const pw2 = document.getElementById('pw2').value;
    if (!pw) return showMsg('Please enter a new password.', 'error');
    if (pw !== pw2) return showMsg('Passwords do not match.', 'error');
    document.getElementById('btn').disabled = true;
    try {
      const res = await fetch('/api/reset_password', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ token, new_password: pw })
      });
      const data = await res.json();
      if (data.status === 'success') {
        showMsg(data.message, 'success');
        setTimeout(() => location.href = 'login.html', 2000);
      } else {
        showMsg(data.message || 'Reset failed.', 'error');
        document.getElementById('btn').disabled = false;
      }
    } catch(e) {
      showMsg('Network error. Please try again.', 'error');
      document.getElementById('btn').disabled = false;
    }
  }
</script>
</body>
</html>
