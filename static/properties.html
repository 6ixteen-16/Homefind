<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Properties - Homefinder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="logo">Homefind</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="properties.html">Properties</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <a href="login.html" class="btn-primary">Sign In</a>
    </nav>

    <div class="container">
        <h1 style="margin-bottom: 2rem;">Available Properties</h1>
        
        <div id="error-message" style="color: red; display: none; text-align: center; margin-bottom: 1rem;"></div>

        <div class="grid-3" id="properties-grid">
            <!-- Properties will be loaded here by JavaScript -->
            <p style="text-align: center; width: 100%; grid-column: 1 / -1;">Loading properties...</p>
        </div>
    </div>

    <!-- JavaScript to fetch data from the PHP API and insert it into HTML -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/api/get_properties')
                .then(response => response.json())
                .then(result => {
                    const grid = document.getElementById('properties-grid');
                    grid.innerHTML = ''; // Clear loading text
                    
                    if (result.status === 'success') {
                        if (result.data.length === 0) {
                            grid.innerHTML = '<p style="text-align: center; grid-column: 1 / -1;">No properties available at the moment.</p>';
                            return;
                        }
                        
                        // Loop through properties and build HTML
                        result.data.forEach(prop => {
                            const imageUrl = prop.image_url ? prop.image_url : 'https://via.placeholder.com/800x600?text=No+Image';
                            const bedrooms = prop.bedrooms || 0;
                            const bathrooms = prop.bathrooms || 0;
                            const sqft = prop.square_footage || 0;
                            
                            const cardHTML = `
                                <div class="card">
                                    <img src="${imageUrl}" alt="Property Image">
                                    <div class="card-body">
                                        <h3 class="card-title">${prop.property_name}</h3>
                                        <div class="card-price">${prop.currency || 'USD'} ${parseFloat(prop.price).toLocaleString()}</div>
                                        <div style="color:var(--text-muted); margin:.35rem 0;">${prop.location || prop.city || ''}${prop.country ? ', ' + prop.country : ''}</div>
                                        <div class="card-details">
                                            <span>${bedrooms} Beds</span> &bull; 
                                            <span>${bathrooms} Baths</span> &bull; 
                                            <span>${sqft} sqft</span>
                                        </div>
                                        <div style="color:var(--text-muted); margin:.35rem 0;">${prop.amenities || 'Property amenities available on details page'}</div>
                                        <a href="property.html?id=${prop.property_id}" class="btn-primary" style="display: block; text-align: center;">View Details</a>
                                    </div>
                                </div>
                            `;
                            grid.innerHTML += cardHTML;
                        });
                    } else {
                        document.getElementById('error-message').style.display = 'block';
                        document.getElementById('error-message').innerText = "Error loading properties: " + result.message;
                    }
                })
                .catch(error => {
                    console.error('Error fetching properties:', error);
                    document.getElementById('properties-grid').innerHTML = '<p style="text-align: center; color: red; grid-column: 1 / -1;">Failed to connect to the server.</p>';
                });
        });
    </script>
</body>
</html>
