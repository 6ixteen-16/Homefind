<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Properties - Homefind</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="tenant_portal.html" class="logo">Homefind</a>
        <ul class="nav-links">
            <li><a href="tenant_portal.html">Dashboard</a></li>
        </ul>
        <a href="tenant_portal.html" class="btn-primary">Back to Dashboard</a>
    </nav>

    <div class="container">
        <h1 style="margin-bottom: 2rem;">Available Properties</h1>
        
        <div id="error-message" style="color: red; display: none; text-align: center; margin-bottom: 1rem;"></div>

        <div class="grid-3" id="properties-grid">
            <p style="text-align: center; width: 100%; grid-column: 1 / -1;">Loading properties...</p>
        </div>
    </div>

    <script src="esc.js"></script>
    <script>
        const authToken = localStorage.getItem('auth_token');
        if (!authToken) {
            window.location.replace('login.html');
        }

        document.addEventListener('DOMContentLoaded', function() {
            fetch('/api/get_properties', {
                headers: { 'Authorization': 'Bearer ' + authToken }
            })
                .then(async response => {
                    if (response.status === 401 || response.status === 403) {
                        localStorage.removeItem('auth_token');
                        window.location.replace('login.html');
                        return;
                    }
                    const result = await response.json();
                    if (!response.ok) {
                        throw new Error(result.detail || result.message || `Server returned HTTP ${response.status}`);
                    }
                    return result;
                })
                .then(result => {
                    if (!result) return;
                    const grid = document.getElementById('properties-grid');
                    grid.innerHTML = '';
                    
                    if (result.status === 'success') {
                        if (!result.data || result.data.length === 0) {
                            grid.innerHTML = '<p style="text-align: center; grid-column: 1 / -1;">No properties available at the moment.</p>';
                            return;
                        }
                        
                        result.data.forEach(prop => {
                            const imageUrl = prop.image_url ? prop.image_url : '/uploads/PROP_39413964_a32fe75a26a14e258e43cd17208d1aed.png';
                            const bedrooms = prop.bedrooms || 0;
                            const bathrooms = prop.bathrooms || 0;
                            const sqft = prop.square_footage || 0;
                            
                            const cardHTML = `
                                <div class="card">
                                    <img src="${esc(imageUrl)}" alt="Property Image" onerror="this.src='/uploads/PROP_39413964_a32fe75a26a14e258e43cd17208d1aed.png'">
                                    <div class="card-body">
                                        <h3 class="card-title">${esc(prop.property_name)}</h3>
                                        <div class="card-price">${esc(prop.currency || 'USD')} ${parseFloat(prop.price).toLocaleString()}</div>
                                        <div style="color:var(--text-muted); margin:.35rem 0;">${esc(prop.location || prop.city || '')}${prop.country ? ', ' + esc(prop.country) : ''}</div>
                                        <div class="card-details">
                                            <span>${esc(bedrooms)} Beds</span> &bull; 
                                            <span>${esc(bathrooms)} Baths</span> &bull; 
                                            <span>${esc(sqft)} sqft</span>
                                        </div>
                                        <div style="color:var(--text-muted); margin:.35rem 0;">${esc(prop.amenities || 'Property amenities available on details page')}</div>
                                        <a href="property.html?id=${esc(encodeURIComponent(prop.property_id))}" class="btn-primary" style="display: block; text-align: center;">View Details &amp; Inquire</a>
                                    </div>
                                </div>
                            `;
                            grid.innerHTML += cardHTML;
                        });
                    } else {
                        document.getElementById('error-message').style.display = 'block';
                        document.getElementById('error-message').innerText = "Error loading properties: " + (result.detail || result.message || "The server could not load properties.");
                    }
                })
                .catch(error => {
                    document.getElementById('error-message').style.display = 'block';
                    document.getElementById('error-message').innerText = "Error loading properties: " + (error.message || "Failed to connect to the server.");
                    document.getElementById('properties-grid').innerHTML = '';
                });
        });
    </script>
</body>
</html>
