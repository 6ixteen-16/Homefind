<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Homefind</title>
    <meta name="description" content="Get in touch with the Homefind team for any inquiries about properties or services.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">Homefind</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <a href="login.html" id="nav-auth-btn" class="btn-primary">Sign In</a>
    </nav>

    <div class="container" style="max-width: 700px; margin: 4rem auto;">
        <h1 style="margin-bottom: 0.5rem;">Contact Us</h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Have a question? Fill in the form below and we will get back to you shortly.</p>

        <div id="success-message" style="display:none; background: #d1fae5; color: #065f46; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; text-align: center;">
            Your message has been sent! We will get back to you soon.
        </div>
        <div id="error-message" style="display:none; background: #fee2e2; color: #dc2626; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; text-align: center;"></div>

        <div style="background: var(--white); padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); border: 1px solid var(--border-color);">
            <form id="contact-form" style="display: flex; flex-direction: column; gap: 1.2rem;">
                <div>
                    <label style="display:block; margin-bottom: 0.3rem; font-weight: 500;">Full Name</label>
                    <input type="text" id="name" placeholder="Your full name" required style="width: 100%; padding: 0.6rem; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 1rem; box-sizing: border-box;">
                </div>
                <div>
                    <label style="display:block; margin-bottom: 0.3rem; font-weight: 500;">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required style="width: 100%; padding: 0.6rem; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 1rem; box-sizing: border-box;">
                </div>
                <div>
                    <label style="display:block; margin-bottom: 0.3rem; font-weight: 500;">Subject</label>
                    <input type="text" id="subject" placeholder="What is this about?" required style="width: 100%; padding: 0.6rem; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 1rem; box-sizing: border-box;">
                </div>
                <div>
                    <label style="display:block; margin-bottom: 0.3rem; font-weight: 500;">Message</label>
                    <textarea id="message" rows="6" placeholder="Write your message here..." required style="width: 100%; padding: 0.6rem; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 1rem; resize: vertical; box-sizing: border-box;"></textarea>
                </div>
                <button type="submit" class="btn-primary" style="align-self: flex-start; padding: 0.75rem 2rem; cursor: pointer;">Send Message</button>
            </form>
        </div>
    </div>

    <script>
        const authToken = localStorage.getItem('auth_token');
        if (authToken) {
            document.getElementById('nav-auth-btn').textContent = 'Browse Properties';
            document.getElementById('nav-auth-btn').href = 'properties.html';
        }

        document.getElementById('contact-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value,
            };

            fetch('/api/contact', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(result => {
                if (result.status === 'success') {
                    document.getElementById('success-message').style.display = 'block';
                    document.getElementById('contact-form').reset();
                } else {
                    document.getElementById('error-message').style.display = 'block';
                    document.getElementById('error-message').innerText = result.message || 'Something went wrong.';
                }
            })
            .catch(() => {
                document.getElementById('success-message').style.display = 'block';
                document.getElementById('contact-form').reset();
            });
        });
    </script>
</body>
</html>
