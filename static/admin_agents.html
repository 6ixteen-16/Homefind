<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Agents - Homefinder Admin</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: var(--white); border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; padding: 1.5rem; }
        .main-content { flex: 1; padding: 2rem; background: var(--background); }
        .sidebar a { display: block; padding: 0.75rem 1rem; color: var(--text-color); text-decoration: none; border-radius: 8px; margin-bottom: 0.5rem; font-weight: 500; transition: all 0.2s; }
        .sidebar a:hover, .sidebar a.active { background: #f3f4f6; color: var(--primary-color); }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        
        .panel { background: var(--white); border-radius: 12px; border: 1px solid #e5e7eb; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 1rem 1.5rem; background: #f9fafb; font-weight: 600; font-size: 0.85rem; color: var(--text-muted); border-bottom: 1px solid #e5e7eb; }
        td { padding: 1rem 1.5rem; border-bottom: 1px solid #e5e7eb; font-size: 0.9rem; }
        tr:hover td { background: #f9fafb; }
        
        .action-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 0.25rem; border-radius: 4px; }
        .action-btn:hover { background: #e5e7eb; color: var(--text-color); }
        .action-btn.delete:hover { color: #dc2626; background: #fee2e2; }

        /* Modal Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 50; }
        .modal { background: var(--white); padding: 2rem; border-radius: 12px; width: 400px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .modal h2 { margin-bottom: 1.5rem; font-size: 1.25rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-color); }
        .form-group input { width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 6px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem; }
    </style>
</head>
<body>

    <div class="admin-layout">
        <div class="sidebar">
            <h2 style="margin-bottom: 2rem; color: var(--primary-color);">Homefind Admin</h2>
            <a href="dashboard.html">Dashboard</a>
            <a href="admin_agents.html" class="active">Manage Agents</a>
            <a href="admin_listings.html">Manage Listings</a>
            <a href="admin_inquiries.html">Inquiries</a>
            <div style="margin-top: auto;">
                <a href="index.html">← Back to Site</a>
                <a href="#" onclick="logout()" style="color: #dc2626;">Logout</a>
            </div>
        </div>

        <div class="main-content">
            <div class="header-section">
                <div>
                    <h1 style="font-weight: 300; font-size: 2.2rem; margin-bottom: 0.5rem;">Agents</h1>
                    <p style="color: var(--text-muted);">Manage real estate agents on the platform.</p>
                </div>
                <button class="btn-primary" onclick="openModal('add')" style="background: #d97706;">+ Add Agent</button>
            </div>

            <div class="panel">
                <table id="agents-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th style="text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Loading agents...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="agent-modal">
        <div class="modal">
            <h2 id="modal-title">Add Agent</h2>
            <form id="agent-form">
                <input type="hidden" id="agent-id">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="agent-name" required>
                </div>
                <div class="form-group" id="email-group">
                    <label>Email Address</label>
                    <input type="email" id="agent-email" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="agent-phone" required>
                </div>
                <div class="form-group" id="password-group">
                    <label>Password</label>
                    <input type="password" id="agent-password" required>
                </div>
                <div class="modal-actions">
                    <button type="button" onclick="closeModal()" style="background: none; border: none; font-weight: 500; cursor: pointer;">Cancel</button>
                    <button type="submit" class="btn-primary" style="background: #d97706;">Save Agent</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('auth_token');
        if (!token) window.location.href = 'login.html';

        const apiOptions = (method = 'GET', body = null) => {
            const opts = { headers: { 'Authorization': 'Bearer ' + token } };
            if (method !== 'GET') {
                opts.method = method;
                opts.headers['Content-Type'] = 'application/json';
                if (body) opts.body = JSON.stringify(body);
            }
            return opts;
        };

        function fetchAgents() {
            fetch('/api/admin/agents', apiOptions())
                .then(res => res.json())
                .then(res => {
                    const tbody = document.querySelector('#agents-table tbody');
                    if (res.status === 'success') {
                        if (res.data.length === 0) {
                            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">No agents found.</td></tr>';
                            return;
                        }
                        tbody.innerHTML = res.data.map(agent => `
                            <tr>
                                <td style="font-weight: 500;">${agent.name}</td>
                                <td>${agent.email}</td>
                                <td>${agent.phone_number}</td>
                                <td style="text-align: right; gap: 0.5rem; display: flex; justify-content: flex-end;">
                                    <button class="action-btn" onclick="editAgent('${agent.agent_id}', '${agent.name}', '${agent.phone_number}')">Edit</button>
                                    <button class="action-btn delete" onclick="deleteAgent('${agent.agent_id}')">Delete</button>
                                </td>
                            </tr>
                        `).join('');
                    } else {
                        alert(res.message);
                    }
                });
        }

        function openModal(mode) {
            document.getElementById('agent-modal').style.display = 'flex';
            const isAdd = mode === 'add';
            document.getElementById('modal-title').innerText = isAdd ? 'Add Agent' : 'Edit Agent';
            document.getElementById('email-group').style.display = isAdd ? 'block' : 'none';
            document.getElementById('password-group').style.display = isAdd ? 'block' : 'none';
            document.getElementById('agent-email').required = isAdd;
            document.getElementById('agent-password').required = isAdd;
            
            if (isAdd) document.getElementById('agent-form').reset();
        }

        function closeModal() {
            document.getElementById('agent-modal').style.display = 'none';
        }

        function editAgent(id, name, phone) {
            document.getElementById('agent-id').value = id;
            document.getElementById('agent-name').value = name;
            document.getElementById('agent-phone').value = phone;
            openModal('edit');
        }

        function deleteAgent(id) {
            if (!confirm('Are you sure you want to delete this agent? This will also remove their user account.')) return;
            fetch(`/api/admin/agents/${id}`, apiOptions('DELETE'))
                .then(res => res.json())
                .then(res => {
                    if (res.status === 'success') fetchAgents();
                    else alert(res.message);
                });
        }

        document.getElementById('agent-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('agent-id').value;
            const data = {
                name: document.getElementById('agent-name').value,
                phone_number: document.getElementById('agent-phone').value,
            };
            
            if (id) {
                // Edit
                fetch(`/api/admin/agents/${id}`, apiOptions('PUT', data))
                    .then(res => res.json())
                    .then(res => {
                        if (res.status === 'success') { closeModal(); fetchAgents(); }
                        else alert(res.message);
                    });
            } else {
                // Add
                data.email = document.getElementById('agent-email').value;
                data.password = document.getElementById('agent-password').value;
                fetch(`/api/admin/agents`, apiOptions('POST', data))
                    .then(res => res.json())
                    .then(res => {
                        if (res.status === 'success') { closeModal(); fetchAgents(); }
                        else alert(res.message);
                    });
            }
        });

        function logout() {
            localStorage.removeItem('auth_token');
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', fetchAgents);
    </script>
</body>
</html>
