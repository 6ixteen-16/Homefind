<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Homefinder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--background);">

    <div style="background: var(--white); padding: 2rem; border-radius: 8px; width: 400px; max-width: 92vw; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <h2 style="text-align: center; margin-bottom: 0.5rem; color: var(--primary-color);">Change your password</h2>
        <p style="text-align: center; font-size: 0.9rem; margin-bottom: 1.5rem;">
            Your password is more than 90 days old. Please choose a new one to continue.
        </p>

        <div id="message-box" style="display: none; padding: 0.5rem; margin-bottom: 1rem; border-radius: 4px; text-align: center;"></div>

        <form id="change-form" style="display: flex; flex-direction: column; gap: 1rem;">
            <input type="email" id="email" placeholder="Email Address" required autocomplete="username" style="padding: 0.5rem; width: 100%;">
            <input type="password" id="current-password" placeholder="Current password" required autocomplete="current-password" style="padding: 0.5rem; width: 100%;">
            <input type="password" id="new-password" placeholder="New password (at least 8 characters)" required minlength="8" maxlength="128" autocomplete="new-password" style="padding: 0.5rem; width: 100%;">
            <input type="password" id="confirm-password" placeholder="Confirm new password" required minlength="8" maxlength="128" autocomplete="new-password" style="padding: 0.5rem; width: 100%;">
            <button type="submit" id="submit-btn" class="btn-primary">Update password</button>
        </form>

        <p style="text-align: center; margin-top: 1rem; font-size: 0.85rem;">
            <a href="login.html">Back to login</a>
        </p>
    </div>

    <script>
        const form = document.getElementById('change-form');
        const msgBox = document.getElementById('message-box');
        const btn = document.getElementById('submit-btn');

        function showMessage(text, ok) {
            msgBox.style.display = 'block';
            msgBox.style.background = ok ? '#d1fae5' : '#fee2e2';
            msgBox.style.color = ok ? '#065f46' : '#dc2626';
            msgBox.innerText = text;
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            msgBox.style.display = 'none';
            const newPassword = document.getElementById('new-password').value;
            if (newPassword !== document.getElementById('confirm-password').value) {
                showMessage('The two new passwords do not match.', false);
                return;
            }
            btn.disabled = true;
            fetch('/api/change_password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('email').value,
                    current_password: document.getElementById('current-password').value,
                    new_password: newPassword
                })
            })
            .then(res => res.json())
            .then(result => {
                btn.disabled = false;
                if (result.status === 'success') {
                    showMessage(result.message, true);
                    form.reset();
                    setTimeout(() => { window.location.href = result.redirect || 'login.html'; }, 1500);
                } else {
                    showMessage(result.message || 'Could not change the password.', false);
                }
            })
            .catch(() => {
                btn.disabled = false;
                showMessage('Failed to connect to the server.', false);
            });
        });
    </script>
</body>
</html>
