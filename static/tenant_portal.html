<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tenant Home | Homefind</title><link rel="stylesheet" href="style.css">
    <style>
        .portal{min-height:100vh;background:#f7f2e9}.portal-nav{background:#25445a;color:#fff;padding:1rem clamp(1rem,4vw,4rem);display:flex;justify-content:space-between;align-items:center;gap:1rem}.portal-nav a{color:#e4eef3;text-decoration:none;font-weight:700}.portal-brand{font-size:1.3rem;font-weight:800}.portal-main{max-width:1320px;margin:auto;padding:clamp(1.25rem,4vw,3rem)}.hero-line{display:flex;justify-content:space-between;align-items:end;gap:2rem;margin-bottom:2rem}.eyebrow{color:#c9783e;text-transform:uppercase;letter-spacing:.14em;font-size:.75rem;font-weight:800}.hero-line h1{font-size:clamp(1.8rem,4vw,3.2rem);color:#25445a;line-height:1.05;margin-top:.35rem}.hero-line p{color:#71818a;margin-top:.6rem}.portal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem}.metric,.panel,.property-card{background:#fff;border:1px solid #e9dfd0;border-radius:14px;box-shadow:0 8px 20px rgba(37,68,90,.07)}.metric{padding:1.2rem}.metric strong{display:block;font-size:2rem;color:#25445a}.metric span{color:#829097;font-size:.9rem}.content-grid{display:grid;grid-template-columns:1fr .72fr;gap:1.5rem}.panel{padding:1.35rem;margin-bottom:1.5rem}.panel h2{color:#25445a;font-size:1.1rem;margin-bottom:1rem}.property-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}.property-card{overflow:hidden}.property-card img{width:100%;height:135px;object-fit:cover;background:#e9eef0}.property-card .body{padding:1rem}.property-card h3{color:#25445a;font-size:1rem;margin-bottom:.25rem}.property-card p{color:#71818a;font-size:.85rem}.property-card strong{display:block;color:#c05f38;margin-top:.6rem}.property-card button{margin-top:.8rem;width:100%}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:480px}th,td{text-align:left;padding:.8rem .5rem;border-bottom:1px solid #eee8de}th{color:#829097;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}td{color:#4e6875}.status{display:inline-flex;padding:.25rem .55rem;border-radius:999px;background:#e5f0f2;color:#2d6872;font-size:.75rem;font-weight:700}.profile{display:grid;gap:.65rem}.profile div{display:flex;justify-content:space-between;gap:1rem;border-bottom:1px solid #edf1f2;padding:.55rem 0}.profile dt{color:#829097}.profile dd{color:#4e6875;font-weight:700;text-align:right}.inquiry-box{background:#f1f7f5;border-color:#cfe4dc}.inquiry-box label{display:block;color:#4e6875;font-weight:700;font-size:.85rem;margin:.75rem 0}.inquiry-box input,.inquiry-box textarea{display:block;width:100%;border:1px solid #d5e1df;border-radius:7px;padding:.65rem;margin-top:.3rem;font:inherit}.inquiry-box textarea{min-height:85px;resize:vertical}button{border:0;border-radius:8px;background:#c05f38;color:#fff;font-weight:800;padding:.7rem 1rem;cursor:pointer}button:hover{background:#9f4829}.message{margin-top:.8rem;color:#2d765c;font-weight:700}.empty{color:#8b989d;padding:1rem 0}@media(max-width:900px){.content-grid{display:block}.portal-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.portal-grid,.property-grid{grid-template-columns:1fr 1fr}.hero-line{display:block}.portal-nav{align-items:flex-start}}@media(max-width:430px){.property-grid{grid-template-columns:1fr}}
    </style>
</head>
<body class="portal">
<nav class="portal-nav"><a class="portal-brand" href="/">HOMEFIND / TENANT</a><div><a href="/properties.html">Public search</a> <button id="logout" type="button">Log out</button></div></nav>
<main class="portal-main"><section class="hero-line"><div><div class="eyebrow">Tenant home</div><h1 id="welcome">Find your next address</h1><p>Explore verified listings and keep your property conversations in one place.</p></div></section><section class="portal-grid"><div class="metric"><strong id="available-count">-</strong><span>Available homes</span></div><div class="metric"><strong id="featured-count">-</strong><span>Featured picks</span></div><div class="metric"><strong id="inquiry-count">-</strong><span>Your enquiries</span></div></section><div class="content-grid"><div><section class="panel"><h2>Recommended homes</h2><div id="properties" class="property-grid"></div></section><section class="panel"><h2>Your enquiry history</h2><div id="inquiries" class="table-wrap"></div></section></div><aside><section class="panel"><h2>Your profile</h2><dl id="profile" class="profile"></dl></section><section class="panel inquiry-box"><h2>Ask about a property</h2><form id="inquiry-form"><label>Property ID<input id="property-id" required placeholder="Select from a listing"></label><label>Your message<textarea id="message" required placeholder="Tell the agent what you need..."></textarea></label><button type="submit">Send enquiry</button></form><div id="form-message" class="message"></div></section></aside></div></main>
<script>
const token=localStorage.getItem('auth_token');if(!token)location.href='login.html';const headers={Authorization:'Bearer '+token};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let profile=null;
async function load(){const response=await fetch('/api/tenant/overview',{headers});if(response.status===401||response.status===403){localStorage.removeItem('auth_token');location.href='login.html';return}const result=await response.json();if(result.status!=='success')throw Error(result.detail||result.message);const d=result.data;profile=d.profile;document.getElementById('welcome').textContent='Welcome, '+d.profile.name;document.getElementById('available-count').textContent=d.properties.length;document.getElementById('featured-count').textContent=d.properties.filter(p=>p.is_featured).length;document.getElementById('inquiry-count').textContent=d.inquiries.length;document.getElementById('profile').innerHTML=`<div><dt>Name</dt><dd>${esc(d.profile.name)}</dd></div><div><dt>Email</dt><dd>${esc(d.profile.email)}</dd></div><div><dt>Address</dt><dd>${esc(d.profile.address||'Not provided')}</dd></div>`;document.getElementById('properties').innerHTML=d.properties.length?d.properties.map(p=>`<article class="property-card"><img src="${esc(p.image_url||'/uploads/PROP_39413964_a32fe75a26a14e258e43cd17208d1aed.png')}" alt="${esc(p.property_name)}"><div class="body"><h3>${esc(p.property_name)}</h3><p>${esc(p.city)}, ${esc(p.country)} · ${p.bedrooms||0} beds · ${p.bathrooms||0} baths</p><strong>${Number(p.price||0).toLocaleString()}</strong><button type="button" data-property="${esc(p.property_id)}">Ask about this home</button></div></article>`).join(''):'<p class="empty">No published properties are available right now.</p>';document.querySelectorAll('[data-property]').forEach(button=>button.onclick=()=>{document.getElementById('property-id').value=button.dataset.property;document.getElementById('message').focus()});document.getElementById('inquiries').innerHTML=d.inquiries.length?`<table><thead><tr><th>Property ID</th><th>Status</th><th>Message</th></tr></thead><tbody>${d.inquiries.map(i=>`<tr><td>${esc(i.property_id)}</td><td><span class="status">${esc(i.status)}</span></td><td>${esc(i.message)}</td></tr>`).join('')}</tbody></table>`:'<p class="empty">Your submitted enquiries will appear here.</p>'}
document.getElementById('inquiry-form').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/submit_inquiry',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({property_id:document.getElementById('property-id').value,name:profile.name,email:profile.email,message:document.getElementById('message').value})});const d=await r.json();document.getElementById('form-message').textContent=d.status==='success'?'Enquiry sent to the property team.':(d.detail||d.message||'Could not send enquiry.');if(d.status==='success'){e.target.reset();load()}});document.getElementById('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST',headers});localStorage.removeItem('auth_token');location.href='login.html'};load().catch(e=>document.getElementById('properties').innerHTML=`<p class="empty">${esc(e.message)}</p>`);
</script>
</body></html>
