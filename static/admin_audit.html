<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Log - Homefind Admin</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: var(--white); border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; padding: 1.5rem; flex-shrink: 0; }
        .main-content { flex: 1; padding: 2rem; background: var(--background); overflow-x: auto; }
        .sidebar a { display: block; padding: 0.75rem 1rem; color: var(--text-color); text-decoration: none; border-radius: 8px; margin-bottom: 0.5rem; font-weight: 500; }
        .sidebar a:hover { background: #f3f4f6; color: var(--primary-color); }
        .panel { background: var(--white); border-radius: 12px; border: 1px solid #e5e7eb; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; border-bottom: 1px solid #e5e7eb; text-align: left; }
        th { background: #f9fafb; color: var(--text-muted); font-size: 0.85rem; }
        @media (max-width: 760px) { .admin-layout { display: block; } .sidebar { width: auto; } .main-content { padding: 1rem; } }
    </style>
</head>
<body>
    <div class="admin-layout">
        <nav class="sidebar">
            <h2 style="margin: 0 0 2rem; color: var(--primary-color);">Homefind Admin</h2>
            <a href="dashboard.html">Dashboard</a>
            <a href="admin_agents.html">Manage Agents</a>
            <a href="admin_listings.html">Manage Listings</a>
            <a href="admin_inquiries.html">Inquiries</a>
            <a href="admin_verification.html">Owners &amp; Verification</a>
            <div style="margin-top: auto;">
                <a href="index.html">← Back to Site</a>
                <a href="login.html" onclick="logout(); return false;" style="color: #dc2626;">Logout</a>
            </div>
        </nav>
        <main class="main-content">
            <h1 style="font-weight: 300; font-size: 2.2rem;">Recent Activity</h1>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Latest 100 recorded admin and user actions.</p>
            <div class="panel">
                <table>
                    <thead><tr><th>When</th><th>User</th><th>Action</th><th>Area</th><th>Record</th></tr></thead>
                    <tbody id="audit-rows"><tr><td colspan="5" style="text-align: center;">Loading activity...</td></tr></tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="esc.js"></script>
    <script>
        const token = localStorage.getItem('auth_token');
        if (!token) window.location.href = 'login.html';
        const apiHeaders = { Authorization: 'Bearer ' + token };

        function logout() {
            localStorage.removeItem('auth_token');
            fetch('/api/logout', { method: 'POST', headers: apiHeaders })
                .finally(() => { window.location.href = 'login.html'; });
        }

        function formatDate(str) {
            if (!str) return '—';
            const d = new Date(str.replace(' ', 'T'));
            if (isNaN(d)) return str;
            return d.toLocaleString(undefined, { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const rows = document.getElementById('audit-rows');
            try {
                const response = await fetch('/api/admin/audit_logs', { headers: apiHeaders });
                if (response.status === 401 || response.status === 403) {
                    localStorage.removeItem('auth_token');
                    window.location.href = 'login.html';
                    return;
                }
                const result = await response.json();
                if (!response.ok || result.status !== 'success') throw new Error(result.detail || result.message || 'Could not load activity.');
                rows.innerHTML = result.data.length ? result.data.map(log => `
                    <tr>
                        <td>${esc(formatDate(log.created_at))}</td>
                        <td>${esc(log.user_email || 'System')}</td>
                        <td>${esc(String(log.action || '').replace(/_/g, ' ').toLowerCase())}</td>
                        <td>${esc(log.table_name || '')}</td>
                        <td>${esc(log.record_id || '')}</td>
                    </tr>`).join('') : '<tr><td colspan="5" style="text-align: center;">No activity recorded yet.</td></tr>';
            } catch (error) {
                rows.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #b91c1c;">${esc(error.message)}</td></tr>`;
            }
        });
    </script>
</body>
</html>
